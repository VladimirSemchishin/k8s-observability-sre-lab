apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - k8s/namespace.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/servicemonitor.yaml
configMapGenerator:
  - name: demo-load-src
    files:
      - app/main.go
      - app/go.mod
      - app/go.sum
