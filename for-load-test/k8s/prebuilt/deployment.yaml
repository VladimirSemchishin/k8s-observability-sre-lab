# Prebuilt image path. Substitute IMAGE before apply (see README).
#   sed "s|image: IMAGE|image: ${IMAGE}|" for-load-test/k8s/prebuilt/deployment.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-load
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-load
    spec:
      automountServiceAccountToken: false
      containers:
        - name: demo-load
          image: IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: demo-load
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.opentelemetry-collector.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
