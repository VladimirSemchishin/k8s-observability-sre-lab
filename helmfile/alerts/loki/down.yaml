apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-loki
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    grokbot-alerts: "1"
spec:
  groups:
    - name: lab.loki
      rules:
      - alert: LokiDown
        expr: max(up{job="loki/loki"}) == 0 or absent(up{job="loki/loki"})
        for: 2m
        labels:
          severity: critical
          service: loki
        annotations:
          summary: Loki is down
          description: "Job {{ $labels.job }} has been down for 2 minutes."
