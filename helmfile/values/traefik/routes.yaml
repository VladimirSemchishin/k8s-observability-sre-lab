# Shared UI basicAuth + HTTP→HTTPS.
# Lab default: admin / admin (htpasswd bcrypt). Same middleware for later /ui/* routes.
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ui-auth
      namespace: traefik
    type: Opaque
    stringData:
      users: |
        admin:$2b$10$vei2EDYFvrpI8v.xHGhCzeTudhuZ4L7SCICTKabr7A2HBrKsMOeCG
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: ui-auth
      namespace: traefik
    spec:
      basicAuth:
        secret: ui-auth
        # Strip Basic so backends can use Authorization: Bearer (Dashboard).
        removeHeader: true
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: redirect-to-https
      namespace: traefik
    spec:
      redirectScheme:
        scheme: https
        permanent: true
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: http-to-https
      namespace: traefik
    spec:
      ingressClassName: traefik
      entryPoints:
        - web
      routes:
        - match: PathPrefix(`/`)
          priority: 1
          middlewares:
            - name: redirect-to-https
          services:
            - name: noop@internal
              kind: TraefikService
