# Traefik edge: /ui/grafana, /ui/prometheus, /ui/alertmanager
# PathPrefix only (NO stripPrefix). Grafana serve_from_sub_path; Prom/AM routePrefix.
# ui-auth cookie/basic gate (traefik ns). Grafana/Prom UIs use cookies not Bearer — OK.

extraManifests:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: grafana
      namespace: monitoring
    spec:
      ingressClassName: traefik
      entryPoints:
        - websecure
      routes:
        - match: PathPrefix(`/ui/grafana`)
          kind: Rule
          middlewares:
            - name: ui-auth
              namespace: traefik
          services:
            - name: kube-prometheus-stack-grafana
              port: 80
      tls: {}
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: prometheus
      namespace: monitoring
    spec:
      ingressClassName: traefik
      entryPoints:
        - websecure
      routes:
        - match: PathPrefix(`/ui/prometheus`)
          kind: Rule
          middlewares:
            - name: ui-auth
              namespace: traefik
          services:
            - name: kube-prometheus-stack-prometheus
              port: 9090
      tls: {}
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: alertmanager
      namespace: monitoring
    spec:
      ingressClassName: traefik
      entryPoints:
        - websecure
      routes:
        - match: PathPrefix(`/ui/alertmanager`)
          kind: Rule
          middlewares:
            - name: ui-auth
              namespace: traefik
          services:
            - name: kube-prometheus-stack-alertmanager
              port: 9093
      tls: {}
