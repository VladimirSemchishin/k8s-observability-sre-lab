# Official kube-prometheus-stack 90.1.1 / Operator v0.93.1 — overrides only.
# CRDs applied separately via presync kubectl hook (prometheus-operator-crds 31.0.1 slim extract).

crds:
  enabled: false
  upgradeJob:
    enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
  disabled:
    Watchdog: true

kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
windowsMonitoring:
  enabled: false
thanosRuler:
  enabled: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      searchNamespace: ALL
      provider:
        foldersFromFilesStructure: true
  ingress:
    enabled: false
  service:
    type: ClusterIP
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: do-block-storage
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  serviceMonitor:
    enabled: true
    path: /ui/grafana/metrics
  grafana.ini:
    server:
      # root_url comes from values/lab.yaml via public-url.yaml.gotmpl
      serve_from_sub_path: true
    auth:
      disable_login_form: true
      disable_signout_menu: true
    auth.basic:
      enabled: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Admin
  # Sidecar writes this file but reload is 403 (anonymous Admin).
  # postsync scripts/ensure-grafana-datasources.sh POSTs Prom/AM/Loki/Jaeger
  # via in-cluster Service DNS (never the Traefik LB).
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100
      jsonData:
        timeout: 60
        maxLines: 1000
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger.jaeger.svc.cluster.local:16686
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki

prometheus:
  ingress:
    enabled: false
  route:
    main:
      enabled: false
  service:
    type: ClusterIP
  prometheusSpec:
    # externalUrl comes from values/lab.yaml via public-url.yaml.gotmpl
    routePrefix: /ui/prometheus
    retention: 3d
    retentionSize: 4GB
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: true
  ingress:
    enabled: false
  service:
    type: ClusterIP
  alertmanagerSpec:
    # externalUrl comes from values/lab.yaml via public-url.yaml.gotmpl
    routePrefix: /ui/alertmanager
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    # Telegram receiver: telegram.yaml (+ gitignored telegram.local.yaml).

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 30Mi
