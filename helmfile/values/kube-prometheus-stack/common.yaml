# Official kube-prometheus-stack 90.1.1 / Operator v0.93.1 — overrides only.
# CRDs applied separately via presync kubectl hook (prometheus-operator-crds 31.0.1 slim extract).

crds:
  enabled: false
  upgradeJob:
    enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
windowsMonitoring:
  enabled: false
thanosRuler:
  enabled: false

grafana:
  enabled: true
  ingress:
    enabled: false
  service:
    type: ClusterIP
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: do-block-storage
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  grafana.ini:
    server:
      root_url: https://134.199.251.14/ui/grafana/
      serve_from_sub_path: true
    auth:
      disable_login_form: true
      disable_signout_menu: true
    auth.basic:
      enabled: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Admin

prometheus:
  ingress:
    enabled: false
  route:
    main:
      enabled: false
  service:
    type: ClusterIP
  prometheusSpec:
    externalUrl: https://134.199.251.14/ui/prometheus/
    routePrefix: /ui/prometheus
    retention: 3d
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: true
  ingress:
    enabled: false
  service:
    type: ClusterIP
  alertmanagerSpec:
    externalUrl: https://134.199.251.14/ui/alertmanager/
    routePrefix: /ui/alertmanager
    # No PVC — Bravo will add Telegram later

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 30Mi
