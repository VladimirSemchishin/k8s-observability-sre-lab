# Step 6 Telegram routing on the existing kube-prometheus-stack Alertmanager.
# Does not set routePrefix / externalUrl / extraManifests — routePrefix stays in
# common.yaml; externalUrl comes from values/lab.yaml via public-url.yaml.gotmpl;
# extraManifests stay in routes.yaml (PathPrefix, no stripPrefix).
#
# Placeholders render without secrets. Copy telegram.local.yaml.example →
# telegram.local.yaml (gitignored) for a real bot token and chat id.

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: telegram
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token: REPLACE_WITH_TELEGRAM_BOT_TOKEN
            chat_id: 0
            parse_mode: HTML
            send_resolved: true
            disable_notifications: false
            # Alertmanager Go template (tplConfig is false, so Helm leaves {{ }} alone).
            # HTML parse_mode: emojis + <a href> click-me, not a raw label/URL dump.
            message: |-
              {{ if eq .Status "firing" }}🔥 <b>Alerts Firing</b>{{ else }}✅ <b>Alerts Resolved</b>{{ end }}
              {{ range .Alerts }}
              —————
              <b>{{ .Labels.alertname }}</b>
              {{ if .Labels.severity }}{{ if eq .Labels.severity "critical" }}🚨{{ else if eq .Labels.severity "warning" }}⚠️{{ else if eq .Labels.severity "info" }}ℹ️{{ else }}⚪{{ end }} <code>{{ .Labels.severity }}</code>{{ end }}{{ if .Labels.service }}{{ if .Labels.severity }} · {{ end }}<code>{{ .Labels.service }}</code>{{ end }}
              {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ end }}
              {{ if .Annotations.runbook_url }}📖 Runbook: <a href="{{ .Annotations.runbook_url | safeUrl }}">click-me</a>{{ end }}
              {{ if .GeneratorURL }}🔗 Source: <a href="{{ .GeneratorURL | safeUrl }}">click-me</a>{{ end }}
              {{ end }}
    templates:
      - /etc/alertmanager/config/*.tmpl
