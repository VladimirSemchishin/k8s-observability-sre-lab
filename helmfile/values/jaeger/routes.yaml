# Traefik edge: /ui/jaeger
# stripPrefix so Jaeger sees /. Jaeger UI v2.18+ detects /ui/jaeger from the
# browser URL (X-Forwarded-Prefix is also set by Traefik stripPrefix).
# No Traefik ui-auth: Jaeger UI talks to its own API; do not share the
# Authorization header with HTTP Basic (same 401-loop class as Dashboard).
# Chart extraObjects: https://github.com/jaegertracing/helm-charts
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: jaeger-strip-prefix
      namespace: jaeger
    spec:
      stripPrefix:
        prefixes:
          - /ui/jaeger
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: jaeger
      namespace: jaeger
    spec:
      ingressClassName: traefik
      entryPoints:
        - websecure
      routes:
        - match: PathPrefix(`/ui/jaeger`)
          kind: Rule
          middlewares:
            - name: jaeger-strip-prefix
          services:
            - name: jaeger
              port: 16686
      tls: {}
