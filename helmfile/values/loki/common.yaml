# Official grafana-community/loki 18.13.0 / app 3.7.7 — overrides only.
# Chart: https://github.com/grafana-community/helm-charts (OSS Loki; grafana/loki is GEL).
# Monolithic + filesystem for a 2-node DOKS lab (2× s-2vcpu-4gb). No MinIO, no memcached.

deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  rulerConfig:
    storage:
      type: local
      local:
        directory: /var/loki/rules
  tracing:
    enabled: false
  ui:
    enabled: false
  limits_config:
    retention_period: 72h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  sidecar: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    size: 10Gi

# Scalable / distributed targets must stay at 0 with filesystem storage.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Alloy and (later) Grafana talk to Loki on :3100. No extra nginx.
gateway:
  enabled: false

minio:
  enabled: false

rollout_operator:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  alerts:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
