apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-gate
  namespace: kubernetes-dashboard
  labels:
    app: dashboard-gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-gate
  template:
    metadata:
      labels:
        app: dashboard-gate
    spec:
      containers:
        - name: gate
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/dashboard-gate.py"]
          env:
            - name: GATE_USER
              valueFrom:
                secretKeyRef:
                  name: dashboard-gate
                  key: user
            - name: GATE_PASS
              valueFrom:
                secretKeyRef:
                  name: dashboard-gate
                  key: pass
            - name: GATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-gate
                  key: secret
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
      volumes:
        - name: app
          configMap:
            name: dashboard-gate
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-gate
  namespace: kubernetes-dashboard
spec:
  selector:
    app: dashboard-gate
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-gate
  namespace: kubernetes-dashboard
spec:
  forwardAuth:
    address: http://dashboard-gate.kubernetes-dashboard.svc.cluster.local:8080/
    trustForwardHeader: true
    addAuthCookiesToResponse:
      - kd-auth
    authRequestHeaders:
      - Cookie
      - Authorization
