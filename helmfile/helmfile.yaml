# After the cluster exists: one command
#   helmfile -f helmfile/helmfile.yaml sync
# Order: presync hook (traefik.io CRDs) → Traefik → Kubernetes Dashboard.
# skipDeps: charts are vendored under helm-charts/ (official helm repo is 404).

helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
  skipDeps: true

bases:
  - releases/traefik.yaml
  - releases/kubernetes-dashboard.yaml
