releases:
  - name: kube-prometheus-stack
    namespace: monitoring
    chart: helm-charts/kube-prometheus-stack-90.1.1.tgz
    needs:
      - traefik/traefik
    labels:
      stack: monitoring
    values:
      - values/kube-prometheus-stack/common.yaml
      - values/kube-prometheus-stack/routes.yaml
      - values/kube-prometheus-stack/telegram.yaml
      # Gitignored. Copy telegram.local.yaml.example and fill bot token / chat id.
      - path: values/kube-prometheus-stack/telegram.local.yaml
        missingFileHandler: Warn
    missingFileHandler: Error
    hooks:
      - events: ["presync"]
        showlogs: true
        command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - -f
          - helm-charts/prometheus-operator-crds/templates
      - events: ["presync"]
        showlogs: true
        command: bash
        args:
          - scripts/apply-grafana-dashboards.sh
      - events: ["postsync"]
        showlogs: true
        command: bash
        args:
          - scripts/apply-telegram-local.sh
      - events: ["postsync"]
        showlogs: true
        command: bash
        args:
          - scripts/apply-grafana-dashboards.sh
      - events: ["postsync"]
        showlogs: true
        command: bash
        args:
          - scripts/apply-prometheus-alerts.sh
