releases:
  - name: traefik
    namespace: traefik
    chart: helm-charts/traefik
    labels:
      stack: traefik
    values:
      - values/traefik/common.yaml
      - values/traefik/routes.yaml
    missingFileHandler: Error
    hooks:
      - events: ["presync"]
        showlogs: true
        command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - -f
          - helm-charts/traefik-io-crds/templates
