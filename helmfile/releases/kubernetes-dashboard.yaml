releases:
  - name: kubernetes-dashboard
    namespace: kubernetes-dashboard
    chart: helm-charts/kubernetes-dashboard
    needs:
      - traefik/traefik
    labels:
      stack: dashboard
    values:
      - values/kubernetes-dashboard/common.yaml
      - values/kubernetes-dashboard/routes.yaml
    missingFileHandler: Error
    hooks:
      - events: ["postsync"]
        showlogs: true
        command: bash
        args:
          - scripts/dashboard-postsync.sh
